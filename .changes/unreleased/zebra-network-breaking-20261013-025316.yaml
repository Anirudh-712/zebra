project: zebra-network
kind: breaking
body: '`init` and `init_with_block_gossip_peer_ips` return a fourth result, `BlockAdvertiser`, which callers must use for outbound block advertisements instead of the ordinary network service. Readiness waits for an eligible connected peer, independently of ordinary request readiness. Its bounded fanout reaches eligible busy peers and succeeds on the first completed local transport write; writes queued for other selected peers continue. If no write succeeds, an acknowledgement timeout takes precedence over other errors and leaves delivery unknown ([#11876](https://github.com/ZcashFoundation/zebra/pull/11876)). `PeerError` adds `AdvertRequiresDedicatedService` and `AdvertAuthorizationRevoked`; downstream exhaustive matches must handle both variants ([#11839](https://github.com/ZcashFoundation/zebra/pull/11839)).'
